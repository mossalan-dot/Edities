<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor — Edities</title>
  <link rel="stylesheet" href="assets/stijl.css">
</head>
<body class="editor-body">
  <header class="sitehoofd">
    <div class="binnen">
      <span class="merk"><a href="index.html">Edities</a></span>
      <nav>
        <a href="index.html">Overzicht</a>
        <a href="editor.html" aria-current="page">Editor</a>
        <a href="spelregels.html">Spelregels</a>
        <button class="thema-knop" type="button" data-thema-knop>Licht / donker</button>
      </nav>
    </div>
  </header>

  <div class="ed-werkbank">
    <div class="ed-balk">
      <div class="ed-balk-links">
        <label class="ed-knop" title="Open een editie.md-bestand">
          Openen…
          <input type="file" id="ed-open" accept=".md,.txt,text/markdown,text/plain" hidden>
        </label>
        <button type="button" class="ed-knop" id="ed-nieuw" title="Begin met een leeg sjabloon">Nieuw</button>
        <span class="ed-scheiding" aria-hidden="true"></span>
        <button type="button" class="ed-knop" id="ed-dl-md">↓ editie.md</button>
        <button type="button" class="ed-knop" id="ed-dl-bron">↓ bron.txt</button>
      </div>
      <div class="ed-balk-rechts">
        <span class="ed-status" id="ed-status" aria-live="polite">—</span>
      </div>
    </div>

    <div class="ed-panelen">
      <section class="ed-bron">
        <div class="ed-paneelkop">
          <span>Bron — <code>editie.md</code></span>
          <button type="button" class="ed-mini" id="ed-legenda-knop" title="Toon/verberg de beknopte spelregels">? spelregels</button>
        </div>
        <div class="ed-opmaakbalk" role="toolbar" aria-label="Opmaakknoppen">
          <button type="button" class="ed-fmt" data-regel="# " title="Kop 1">H1</button>
          <button type="button" class="ed-fmt" data-regel="## " title="Kop 2">H2</button>
          <button type="button" class="ed-fmt" data-regel="### " title="Kop 3">H3</button>
          <span class="ed-scheiding" aria-hidden="true"></span>
          <button type="button" class="ed-fmt" data-wrap="**|**" title="Vet"><b>B</b></button>
          <button type="button" class="ed-fmt" data-wrap="*|*" title="Cursief"><i>I</i></button>
          <button type="button" class="ed-fmt" data-wrap="{sc:|}" title="Kleinkapitaal">Kk</button>
          <button type="button" class="ed-fmt" data-wrap="{ab:|}" title="Opgeloste afkorting (letters binnen een woord)">afk</button>
          <button type="button" class="ed-fmt" data-wrap="{add:|}" title="Toevoeging van de editeur ⟨ ⟩">⟨+⟩</button>
          <button type="button" class="ed-fmt" data-wrap="{del:|}" title="Doorhaling">del</button>
          <button type="button" class="ed-fmt" data-wrap="{unc:|}" title="Onzekere lezing [?]">[?]</button>
          <button type="button" class="ed-fmt" data-wrap="{gap:|}" title="Lacune / onleesbaar">lac</button>
          <button type="button" class="ed-fmt" data-wrap="{marg:|}" title="Toevoeging in de marge">marge</button>
          <span class="ed-scheiding" aria-hidden="true"></span>
          <button type="button" class="ed-fmt" data-blok="~ p. | " title="Paginagrens (begin van een nieuwe pagina/folio)">¶ pagina</button>
          <button type="button" class="ed-fmt" data-blok="@ JJJJ-MM-DD | " title="Dagtekening (datum-navigatie)">◈ datum</button>
          <button type="button" class="ed-fmt" data-regel="- " title="Opsommingsteken">• lijst</button>
          <span class="ed-scheiding" aria-hidden="true"></span>
          <button type="button" class="ed-fmt ed-fmt-noot" data-actie="noot" title="Maak een noot bij de geselecteerde tekst">＋ Noot</button>
        </div>
        <textarea id="ed-invoer" spellcheck="false" autocomplete="off" autocapitalize="off"
          placeholder="Schrijf of open hier een editie.md…"></textarea>
        <div class="ed-legenda" id="ed-legenda" hidden></div>
      </section>
      <section class="ed-voorbeeld">
        <div class="ed-paneelkop">
          <span>Voorbeeld</span>
          <span class="ed-tip">Selecteer tekst om er een noot bij te maken</span>
        </div>
        <iframe id="ed-preview" src="editor-frame.html" title="Voorbeeldweergave van de editie"></iframe>
      </section>
    </div>

    <details class="ed-rapport" id="ed-rapport" hidden>
      <summary>Niet-verankerde noten (<span id="ed-mis-aantal">0</span>)</summary>
      <ul id="ed-mis-lijst"></ul>
    </details>
  </div>

  <div class="ed-modaal" id="ed-nootform" hidden>
    <div class="ed-modaal-kaart" role="dialog" aria-modal="true" aria-labelledby="nf-titel">
      <h3 id="nf-titel">Nieuwe noot</h3>
      <p class="nf-lemma">Lemma: <span id="nf-lemma"></span></p>
      <label class="nf-veld">Apparaat
        <select id="nf-app"></select>
      </label>
      <label class="nf-veld">Inhoud van de noot
        <textarea id="nf-inhoud" rows="4" placeholder="De noottekst…"></textarea>
      </label>
      <p class="nf-hint">Tip: <kbd>Ctrl/Cmd + Enter</kbd> om toe te voegen. Voor een geneste noot
      mag u in de inhoud <code>[[lemma|code|inhoud]]</code> gebruiken.</p>
      <div class="nf-knoppen">
        <button type="button" class="ed-knop" id="nf-annuleer">Annuleren</button>
        <button type="button" class="ed-knop primair" id="nf-toevoegen">Noot toevoegen</button>
      </div>
    </div>
  </div>

  <script src="assets/importeer.js"></script>
  <script src="assets/site.js"></script>
  <script>
  (function () {
    'use strict';
    var invoer = document.getElementById('ed-invoer');
    var preview = document.getElementById('ed-preview');
    var status = document.getElementById('ed-status');
    var rapportBox = document.getElementById('ed-rapport');
    var misAantal = document.getElementById('ed-mis-aantal');
    var misLijst = document.getElementById('ed-mis-lijst');
    var OPSLAG = 'editor-bron';

    var SJABLOON = [
      '---',
      'titel: Titel van de editie',
      'auteur: Naam van de auteur',
      'jaar: 1600',
      'bron: Vindplaats van het origineel',
      'type: handschrift',
      'transcriptie: kritisch',
      'regelnummering: 0',
      'apparaat: w    | Woordverklaringen         | editeur   | links',
      'apparaat: comm | Toelichting en commentaar | editeur   | rechts',
      'apparaat: auteur | Noten van de auteur      | origineel | rechts',
      '---',
      '',
      '# Titel van de editie',
      '',
      '~ p. 1 |',
      '',
      'Begin hier de schone hoofdtekst. Markeer géén noten in de tekst zelf; die',
      'koppelt u onderaan via het notenblok aan een woord of woordgroep.',
      '',
      '=== NOTEN ===',
      'woordgroep | w | Een woordverklaring bij deze woordgroep.',
      '',
      '=== REGISTER ===',
      'plaats | Amsterdam | Amsterdam'
    ].join('\n');

    var LEGENDA = [
      ['Kop', '# / ## / ###'],
      ['Alinea', 'lege regel'],
      ['Paginagrens', '~ p. 1 | doel'],
      ['Dagtekening', '@ 1600-01-02 | 2 januari'],
      ['Cursief / vet', '*cursief*  **vet**'],
      ['Kleinkapitaal', '{sc:tekst}'],
      ['Opgeloste afkorting', '{ex:woord}  ·  Ho{ab:og}Mo'],
      ['Toevoeging editeur', '{add:tekst} → ⟨tekst⟩'],
      ['Onzekere lezing', '{unc:tekst}'],
      ['Lacune', '{gap:reden}'],
      ['Opsomming', '- item   /   1. item'],
      ['Tabel', '| cel | cel |  +  | --- | ---: |'],
      ['Noot', 'lemma | code | inhoud   (in === NOTEN ===)'],
      ['Lange passage', 'eerste … laatste | code | …'],
      ['N-de voorkomen', 'lemma (2) | code | …'],
      ['Geneste noot', 'lemma | auteur | tekst [[woord|comm|…]]'],
      ['Register', 'soort | naam | variant, variant  (in === REGISTER ===)']
    ];
    document.getElementById('ed-legenda').innerHTML =
      '<table>' + LEGENDA.map(function (r) {
        return '<tr><th>' + r[0] + '</th><td><code>' + r[1].replace(/</g, '&lt;') + '</code></td></tr>';
      }).join('') + '</table>' +
      '<p class="ed-legenda-meer"><a href="spelregels.html" target="_blank">Volledige spelregels →</a></p>';

    // ---- Voorbeeld-iframe (editor-frame.html): render via postMessage ------
    var previewKlaar = false, laatsteBron = '';
    window.addEventListener('message', function (e) {
      if (!e.data) return;
      if (e.data.type === 'klaar') {
        previewKlaar = true;
        if (laatsteBron) preview.contentWindow.postMessage({ type: 'bron', bron: laatsteBron }, '*');
      } else if (e.data.type === 'nieuwe-noot') {
        openNootForm(e.data);
      }
    });

    function stuurNaarVoorbeeld(bron) {
      laatsteBron = bron;
      if (previewKlaar) preview.contentWindow.postMessage({ type: 'bron', bron: bron }, '*');
    }

    // ---- Verwerken (debounced) --------------------------------------------
    var laatsteResultaat = { bron: '', rapport: [] };
    function verwerk() {
      var res;
      try {
        res = Importeer.naarBron(invoer.value);
      } catch (err) {
        status.textContent = 'Fout: ' + (err.message || err);
        status.className = 'ed-status fout';
        return;
      }
      laatsteResultaat = res;
      stuurNaarVoorbeeld(res.bron);

      var ok = res.rapport.filter(function (r) { return r.status === 'ok'; }).length;
      var mis = res.rapport.filter(function (r) { return r.status === 'mis'; });
      status.textContent = res.rapport.length
        ? ok + '/' + res.rapport.length + ' noten verankerd'
        : 'geen noten';
      status.className = 'ed-status' + (mis.length ? ' waarschuwing' : ' goed');

      rapportBox.hidden = mis.length === 0;
      misAantal.textContent = mis.length;
      misLijst.innerHTML = mis.map(function (r) {
        return '<li><code>' + escapeHtml(r.tekst) + '</code> <span class="ed-mis-code">(' +
          escapeHtml(r.code) + ')</span></li>';
      }).join('');

      try { localStorage.setItem(OPSLAG, invoer.value); } catch (e) {}
    }
    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    var timer;
    invoer.addEventListener('input', function () {
      clearTimeout(timer);
      timer = setTimeout(verwerk, 350);
    });

    // ---- Openen / nieuw / downloaden --------------------------------------
    document.getElementById('ed-open').addEventListener('change', function (e) {
      var f = e.target.files[0];
      if (!f) return;
      var r = new FileReader();
      r.onload = function () { invoer.value = r.result; verwerk(); };
      r.readAsText(f, 'utf-8');
      e.target.value = '';
    });
    document.getElementById('ed-nieuw').addEventListener('click', function () {
      if (invoer.value.trim() && !confirm('De huidige inhoud vervangen door een leeg sjabloon?')) return;
      invoer.value = SJABLOON;
      verwerk();
    });
    function download(naam, inhoud) {
      var blob = new Blob([inhoud], { type: 'text/plain;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = naam;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    }
    document.getElementById('ed-dl-md').addEventListener('click', function () {
      download('editie.md', invoer.value);
    });
    document.getElementById('ed-dl-bron').addEventListener('click', function () {
      download('bron.txt', laatsteResultaat.bron || Importeer.naarBron(invoer.value).bron);
    });

    document.getElementById('ed-legenda-knop').addEventListener('click', function () {
      var l = document.getElementById('ed-legenda');
      l.hidden = !l.hidden;
    });

    // ---- WYSIWYG: noot toevoegen vanuit een selectie ----------------------
    var nootModaal = document.getElementById('ed-nootform');
    var nfLemma = document.getElementById('nf-lemma');
    var nfApp = document.getElementById('nf-app');
    var nfInhoud = document.getElementById('nf-inhoud');
    var huidigeNoot = null;

    function apparatenUit(bron) {
      var m = bron.match(/^---\s*\n([\s\S]*?)\n---/);
      var lijst = [];
      if (m) m[1].split('\n').forEach(function (r) {
        var mm = r.match(/^\s*apparaat\s*:\s*(.+)$/);
        if (mm) { var d = mm[1].split('|').map(function (x) { return x.trim(); }); lijst.push({ code: d[0], label: d[1] || d[0] }); }
      });
      if (!lijst.length) lijst.push({ code: 'w', label: 'Woordverklaringen' });
      return lijst;
    }

    function lemmaMetOcc(info) {
      return info.occ > 1 ? info.lemma + ' (' + info.occ + ')' : info.lemma;
    }

    function openNootForm(info) {
      huidigeNoot = info;
      nfLemma.textContent = lemmaMetOcc(info);
      nfApp.innerHTML = apparatenUit(invoer.value).map(function (a) {
        return '<option value="' + escapeHtml(a.code) + '">' + escapeHtml(a.label) + ' (' + escapeHtml(a.code) + ')</option>';
      }).join('');
      nfInhoud.value = '';
      nootModaal.hidden = false;
      nfInhoud.focus();
    }
    function sluitNootForm() { nootModaal.hidden = true; huidigeNoot = null; }

    // Voeg een  lemma | code | inhoud -regel toe aan het === NOTEN ===-blok.
    function voegNootToe(bron, lemma, code, inhoud) {
      var regel = lemma + ' | ' + code + ' | ' + inhoud;
      var notenRe = /^[ \t]*={3,}\s*NOTEN\s*={3,}[ \t]*$/m;
      var registerRe = /^[ \t]*={3,}\s*REGISTER\s*={3,}[ \t]*$/m;
      var nm = notenRe.exec(bron);
      if (nm) {
        var rm = registerRe.exec(bron);
        var eind = (rm && rm.index > nm.index) ? rm.index : bron.length;
        var voor = bron.slice(0, eind).replace(/\s*$/, '');
        var na = bron.slice(eind).replace(/^\n+/, '');
        return voor + '\n' + regel + (na ? '\n\n' + na : '\n');
      }
      var rm2 = registerRe.exec(bron);
      if (rm2) {
        var voor2 = bron.slice(0, rm2.index).replace(/\s*$/, '');
        var na2 = bron.slice(rm2.index);
        return voor2 + '\n\n=== NOTEN ===\n' + regel + '\n\n' + na2;
      }
      return bron.replace(/\s*$/, '') + '\n\n=== NOTEN ===\n' + regel + '\n';
    }

    function bevestigNoot() {
      if (!huidigeNoot) return;
      var code = nfApp.value;
      var inhoud = nfInhoud.value.trim() || '…';
      invoer.value = voegNootToe(invoer.value, lemmaMetOcc(huidigeNoot), code, inhoud);
      sluitNootForm();
      verwerk();
    }

    document.getElementById('nf-annuleer').addEventListener('click', sluitNootForm);
    document.getElementById('nf-toevoegen').addEventListener('click', bevestigNoot);
    nootModaal.addEventListener('click', function (e) { if (e.target === nootModaal) sluitNootForm(); });
    nfInhoud.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); bevestigNoot(); }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !nootModaal.hidden) sluitNootForm();
    });

    // ---- Opmaakbalk: knoppen die markup in het tekstvak invoegen ----------
    function omhul(voor, na) {
      var s = invoer.selectionStart, e = invoer.selectionEnd, v = invoer.value;
      var sel = v.slice(s, e);
      invoer.value = v.slice(0, s) + voor + sel + na + v.slice(e);
      if (sel) { invoer.selectionStart = s + voor.length; invoer.selectionEnd = s + voor.length + sel.length; }
      else { invoer.selectionStart = invoer.selectionEnd = s + voor.length; }
      invoer.focus(); verwerk();
    }
    function regelPrefix(prefix) {
      var s = invoer.selectionStart, v = invoer.value;
      var ls = v.lastIndexOf('\n', s - 1) + 1;
      invoer.value = v.slice(0, ls) + prefix + v.slice(ls);
      invoer.selectionStart = invoer.selectionEnd = s + prefix.length;
      invoer.focus(); verwerk();
    }
    function blokInvoegen(tekst) {
      var s = invoer.selectionStart, v = invoer.value;
      var voor = v.slice(0, s).replace(/[ \t]*$/, '');
      var na = v.slice(s).replace(/^[ \t]*/, '');
      var pre = voor ? (/\n\n$/.test(voor) ? '' : /\n$/.test(voor) ? '\n' : '\n\n') : '';
      var ins = pre + tekst;
      invoer.value = voor + ins + (na.charAt(0) === '\n' ? '' : '\n') + na;
      invoer.selectionStart = invoer.selectionEnd = (voor + ins).length;
      invoer.focus(); verwerk();
    }
    function toolbarNoot() {
      var s = invoer.selectionStart, e = invoer.selectionEnd;
      var lemma = invoer.value.slice(s, e).trim().replace(/\s+/g, ' ');
      if (!lemma) {
        status.textContent = 'Selecteer eerst het woord of de woordgroep waar de noot bij hoort.';
        status.className = 'ed-status waarschuwing';
        return;
      }
      var w = lemma.split(' ');
      openNootForm({ lemma: w.length > 5 ? w[0] + ' … ' + w[w.length - 1] : lemma, occ: 0 });
    }
    document.querySelector('.ed-opmaakbalk').addEventListener('click', function (e) {
      var b = e.target.closest('.ed-fmt');
      if (!b) return;
      if (b.dataset.actie === 'noot') { toolbarNoot(); return; }
      if (b.dataset.wrap != null) { var p = b.dataset.wrap.split('|'); omhul(p[0], p[1] || ''); return; }
      if (b.dataset.regel != null) { regelPrefix(b.dataset.regel); return; }
      if (b.dataset.blok != null) { blokInvoegen(b.dataset.blok); return; }
    });

    // ---- Herstel vorige sessie of toon sjabloon ---------------------------
    var bewaard = null;
    try { bewaard = localStorage.getItem(OPSLAG); } catch (e) {}
    invoer.value = bewaard || SJABLOON;
    verwerk();
  })();
  </script>
</body>
</html>
