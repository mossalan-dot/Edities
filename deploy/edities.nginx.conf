# nginx — statische hosting voor de Edities-site (alternatief voor Caddy).
# Plaats als /etc/nginx/sites-available/edities en link naar sites-enabled:
#   sudo ln -s /etc/nginx/sites-available/edities /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo apt install certbot python3-certbot-nginx && sudo certbot --nginx -d edities.example.nl

server {
	listen 80;
	listen [::]:80;
	server_name edities.example.nl;

	root /var/www/edities;
	index index.html;

	# Statische site: probeer bestand, anders map, anders 404.
	location / {
		try_files $uri $uri/ =404;
	}

	# --- Beheer / bewerkmodus achter een wachtwoord ------------------------
	# De editor is de admin-omgeving: alleen met inlog te openen. De rest van
	# de site (alle edities) blijft openbaar. Maak eenmalig een wachtwoord aan:
	#   sudo apt install apache2-utils
	#   sudo htpasswd -c /etc/nginx/edities.htpasswd admin
	location = /editor.html {
		auth_basic "Edities — beheer";
		auth_basic_user_file /etc/nginx/edities.htpasswd;
		try_files $uri =404;
	}
	location = /editor-frame.html {
		auth_basic "Edities — beheer";
		auth_basic_user_file /etc/nginx/edities.htpasswd;
		try_files $uri =404;
	}

	# Assets en afbeeldingen langer cachen.
	location ~* \.(css|js|jpg|jpeg|png|svg|webp)$ {
		expires 7d;
		add_header Cache-Control "public";
	}

	# bron.txt / editie.md kort cachen zodat wijzigingen snel zichtbaar zijn.
	location ~* \.(txt|md)$ {
		expires 5m;
		add_header Cache-Control "public";
	}

	gzip on;
	gzip_types text/css application/javascript text/plain image/svg+xml;
	gzip_min_length 512;
}
