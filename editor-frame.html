<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="assets/stijl.css">
  <style>
    body { padding: 1.5rem 1rem; }
    .noot-knop {
      position: absolute; z-index: 1000; display: none;
      font-family: var(--sans); font-size: .8rem; cursor: pointer;
      background: var(--accent); color: #fff; border: none; border-radius: 6px;
      padding: .25rem .6rem; box-shadow: 0 3px 10px rgba(0,0,0,.25);
    }
    .noot-knop:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <div id="paneel"></div>
  <button type="button" class="noot-knop" id="noot-knop">＋ Noot</button>

  <script src="assets/editie.js"></script>
  <script>
  (function () {
    'use strict';
    var paneel = document.getElementById('paneel');
    var knop = document.getElementById('noot-knop');

    // ---- Render bij binnenkomende bron ------------------------------------
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.type !== 'bron') return;
      paneel.textContent = '';
      var root = document.createElement('div');
      root.id = 'editie';
      paneel.appendChild(root);
      try { Editie.render(root, e.data.bron); }
      catch (err) { paneel.innerHTML = '<p class="fout">' + String(err.message || err) + '</p>'; }
      verbergKnop();
    });

    // ---- Selectie -> "＋ Noot"-knop ---------------------------------------
    function verbergKnop() { knop.style.display = 'none'; }

    function segmentVan(node) {
      var el = node.nodeType === 1 ? node : node.parentNode;
      return el.closest('.rtekst, li, td, th') || (el.closest('.tekst') ? el.closest('.tekst') : null);
    }
    function tel(hooiberg, naald) {
      var h = hooiberg.toLowerCase(), n = naald.toLowerCase(), c = 0, i = 0;
      if (!n) return 0;
      while ((i = h.indexOf(n, i)) !== -1) { c++; i += n.length; }
      return c;
    }
    // Welk voorkomen van het lemma is dit binnen zijn segment? (0 = uniek)
    function berekenVoorkomen(range, lemma) {
      if (lemma.split(' ').length > 5) return 0; // range-lemma: geen (n)
      var seg = segmentVan(range.startContainer);
      if (!seg) return 0;
      var heel = seg.textContent;
      if (tel(heel, lemma) <= 1) return 0;
      var pre = document.createRange();
      pre.selectNodeContents(seg);
      try { pre.setEnd(range.startContainer, range.startOffset); }
      catch (e) { return 0; }
      return tel(pre.toString(), lemma) + 1;
    }

    function toonKnop() {
      var sel = window.getSelection();
      if (!sel || sel.isCollapsed || !sel.toString().trim()) { verbergKnop(); return; }
      var range = sel.getRangeAt(0);
      var anc = range.commonAncestorContainer;
      var el = anc.nodeType === 1 ? anc : anc.parentNode;
      if (!el || !el.closest('.tekst')) { verbergKnop(); return; }
      var rect = range.getBoundingClientRect();
      knop.style.left = (window.scrollX + rect.left) + 'px';
      knop.style.top = (window.scrollY + rect.bottom + 6) + 'px';
      knop.style.display = 'block';
    }

    document.addEventListener('mouseup', function (e) {
      if (e.target === knop) return;
      setTimeout(toonKnop, 0);
    });
    document.addEventListener('scroll', verbergKnop, true);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') verbergKnop(); });

    knop.addEventListener('mousedown', function (e) { e.preventDefault(); }); // behoud selectie
    knop.addEventListener('click', function () {
      var sel = window.getSelection();
      var lemma = sel.toString().trim().replace(/\s+/g, ' ');
      if (!lemma) { verbergKnop(); return; }
      var range = sel.getRangeAt(0);
      var woorden = lemma.split(' ');
      var lemmaVoorNoot = woorden.length > 5
        ? woorden[0] + ' … ' + woorden[woorden.length - 1]
        : lemma;
      var occ = berekenVoorkomen(range, lemma);
      parent.postMessage({ type: 'nieuwe-noot', lemma: lemmaVoorNoot, occ: occ }, '*');
      verbergKnop();
      sel.removeAllRanges();
    });

    parent.postMessage({ type: 'klaar' }, '*');
  })();
  </script>
</body>
</html>
